<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventLitez</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header starts here -->
    <header>
        <div class="head">
            <div class="logo">
             <a href="#">EventLiteZ</a>
            </div>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
     <!-- Header ends here -->

     <!-- main start -->
<main>
<section class="section-1">
   
        <div class="banner-container">
            
            <div class="property-container">
                <div class="top">
                    <h1>CELEBRATE WITH US</h1>

                </div>
                <div class="bottom">Where Every Event Becomes Unforgettable</div>
                <button>Get Started</button>
            </div>
            
        </div>

    </section>
       <!-- section-1 end -->  



    <!-- second section start -->


   <section class="section-2">
    <div class="form-container">
        <div class="left">
            <div class="form-sec">
                <form action="" autocomplete="off">
                    <h2>Create Your Event</h2>
                    <div class="input-group">
                        <label for="name">Event Name</label>
                        <input type="text" id="name" required/>
                    </div>

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required/>
                    </div>

                    <div class="input-group">
                        <label for="time">Time</label>
                        <input type="time" id="time" required/>
                    </div>

                    <div class="input-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" required/>
                    </div>

                    <div class="input-group">
                        <label for="discrip">Description</label>
                        <input type="text" id="discrip"> 
                    </div>

                    <div class="submit-button">
                        <button>Submit</button>
                    </div>

                </form>
            </div>
        </div>

        <div class="right">
            
                <h2>Upcoming Events</h2>
                <ul id="event-list">
                    
                </ul>
            

        </div>
    </div>
   </section>
    
     <!-- second section end -->
    </main>
    
      <!-- main end -->
       <!-- footer starts here -->
       <footer>
        <p>Follow us on</p>
        <div class="icons">
            
            <img src="/EventLitez/images//insta.png" alt="">
            <img src="/EventLitez/images/google_icon.png" alt="">
            <img src="/EventLitez/images/twitter_.png" alt="">
            <img src="/EventLitez/images/whatsapp.png" alt="">
            <img src="/EventLitez/images/YOUTUBE_icon.png" alt="">
        </div>
        <div class="foot">
            Copyright @2025; Design and developed by <span>Arya</span>
        </div>
       </footer>


    
</body>
</html>
